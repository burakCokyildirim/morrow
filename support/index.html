<title>Morrow — Support</title>
<style>:root{--bg:#FAF6F0;--fg:#2B2320;--muted:#6E625C;--accent:#6B3A5B;--rule:#E6DDD3}
@media (prefers-color-scheme:dark){:root{--bg:#171311;--fg:#F1EAE3;--muted:#B3A79F;--accent:#C9A2BD;--rule:#2E2724}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
main{max-width:680px;margin:0 auto;padding:40px 20px 64px}h1{font-size:30px;line-height:1.2;margin:0 0 6px}
h2{font-size:19px;margin:32px 0 8px}p,li{color:var(--fg)}ul{padding-left:22px}.meta{color:var(--muted);margin:0 0 20px}
.lang{float:right;font-size:15px}a{color:var(--accent)}code{font-size:15px;background:var(--rule);padding:1px 5px;border-radius:4px}</style>
</head>
<body>
<main>
<a class="lang" href="../destek/" hreflang="tr">Türkçe</a>
<h1>Support</h1>
<p class="meta"><strong>Morrow</strong> · Support</p>
<p>Questions, feedback or a problem with the app? Write to <a href="mailto:bcokyildirim@gmail.com">bcokyildirim@gmail.com</a> — every message is read by a person.</p>
<p>In the app you can also use Settings ▸ Support, which fills in your app and iOS version for you.</p>
<p><a href="../privacy/">Privacy Policy</a></p>
